[project]
name = "ml-framework-template"
version = "0.1.0"
description = "A generalized, blank Machine Learning framework based on scikit-learn and TensorFlow."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jupyter>=1.1.1",
    "keras>=3.13.2",
    "matplotlib>=3.10.8",
    "pandas>=3.0.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tensorflow>=2.20.0",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "build>=1.4.0",
    "flake8>=7.3.0",
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
format = "black ."
format-check = "black --check ."
flake = "flake8 ./ml-framework-template"
pylint = "pylint ./ml-framework-template"
build = "python -m build"
test = "uv run pytest --cov=ml-framework-template --cov-report=term-missing"
